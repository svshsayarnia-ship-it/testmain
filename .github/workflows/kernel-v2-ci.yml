name: Kernel v2 CI

on:
  push:
    branches:
      - ard-jonoub-executive-v2
    paths:
      - "public/management-kernel-v2.js"
      - "public/kernel-views-v2.js"
      - "public/kernel-ai-v2.js"
      - "public/module-records-v2.js"
      - "public/kernel-bridge.js"
      - "public/ops-depth.js"
      - "public/hr-fix.js"
      - "public/index.html"
      - "public/ard-v2.css"
      - "public/ui-fa.js"\n      - "api/coach.js"\n      - "tests/audit-regression.mjs"\n      - "public/management-kernel.js"
      - "public/fonts/**"
      - "tests/kernel-v2-smoke.mjs"
      - "tests/ui-contract.mjs"
      - ".github/workflows/kernel-v2-ci.yml"
  workflow_dispatch:

jobs:
  kernel-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check kernel
        run: node --check public/management-kernel-v2.js

      - name: Syntax check kernel views
        run: node --check public/kernel-views-v2.js

      - name: Syntax check kernel AI
        run: node --check public/kernel-ai-v2.js

      - name: Syntax check business record layer
        run: node --check public/module-records-v2.js

      - name: Syntax check bridges
        run: |
          node --check public/kernel-bridge.js
          node --check public/ops-depth.js
          node --check public/hr-fix.js

      - name: Run architecture acceptance suite
        run: node tests/kernel-v2-smoke.mjs

      - name: Run UI and mobile contract suite
        run: node tests/ui-contract.mjs
