name: Build Kharid Amn APK

on:
  push:
    branches:
      - trustcheck-android
    paths:
      - 'trustcheck-android/**'
      - '.github/workflows/trustcheck-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 35
        run: yes | sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests and build APK
        working-directory: trustcheck-android
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kharid-amn-apk
          path: trustcheck-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
